name: Live smoke

# Manual only - hits a real Supabase project. Requires repo secrets:
#   SUPABASE_ACCESS_TOKEN
#   SBPERF_SMOKE_REF       (the project ref to probe)
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bun
        run: curl -fsSL https://bun.sh/install -o /tmp/bun.sh && bash /tmp/bun.sh "bun-v1.3.13" && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: live smoke
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SBPERF_SMOKE_REF: ${{ secrets.SBPERF_SMOKE_REF }}
        run: bun run smoke
