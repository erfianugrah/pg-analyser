name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC - catch upstream API drift proactively

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bun
        run: curl -fsSL https://bun.sh/install -o /tmp/bun.sh && bash /tmp/bun.sh "bun-v1.3.13" && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bun run typecheck
      - run: bun test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bun
        run: curl -fsSL https://bun.sh/install -o /tmp/bun.sh && bash /tmp/bun.sh "bun-v1.3.13" && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      # Verify the standalone binary compiles and runs (the release matrix
      # cross-compiles the same entrypoint; catch breakage before a tag).
      - run: bun build ./src/index.ts --compile --outfile sbperf
      - run: ./sbperf --version

  api-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bun
        run: curl -fsSL https://bun.sh/install -o /tmp/bun.sh && bash /tmp/bun.sh "bun-v1.3.13" && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Check endpoints against upstream Management API spec
        run: bun run scripts/check-api-drift.ts
      - name: Check derived inspect SQL against upstream CLI (advisory)
        run: bun run scripts/check-inspect-drift.ts
      - name: Check advisor-lint catalog against splinter.sql (advisory)
        run: bun run scripts/check-lints-drift.ts
      - name: Check app-schema denylist against splinter.sql (advisory)
        run: bun run scripts/check-schemas-drift.ts
